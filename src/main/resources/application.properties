spring.application.name=e-commerce-ju

spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Seguridad - JWT
# Clave en Base64 (minimo 256 bits). En produccion se debe pasar por variable de entorno.
jwt.secret=${JWT_SECRET:1pMCrIowczdTPIcf5xstczXS8rgc+xP60z4+v73kyA/HHORDEGwFJKhNAbYAV2rW}
# Duracion del token: 1 hora
jwt.expiration-ms=3600000

# Usuario administrador que se crea al arrancar si no existe (ver DataInitializer)
app.admin.email=${ADMIN_EMAIL:admin@ecommerce.com}
app.admin.password=${ADMIN_PASSWORD:admin123}
